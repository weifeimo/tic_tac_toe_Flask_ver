name: Frontend CI

# TS ブランチ（Next.js + TypeScript）をレビューするための自動チェック。
# Pull Request の画面に「lint / 型チェック / ビルド」の結果が表示される。
on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: ["TS"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで続けて push したとき、古い実行を止めて無駄を減らす
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Next.js)
        env:
          # next.config.ts の rewrites 用。ビルド時は Flask に接続しないのでダミーで足りる
          FLASK_URL: http://127.0.0.1:5001
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # next-env.d.ts は git 管理外で、ビルド時に生成される。
      # そのため型チェックはビルドの後に置く（先に実行すると *.module.css の型が見つからず失敗する）。
      - name: Type check (TypeScript)
        run: npx tsc --noEmit